[package]
name = "baozi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
baozi-core = { path = "../crates/baozi-core" }
baozi-format-gltf = { path = "../crates/baozi-format-gltf" }
baozi-format-obj = { path = "../crates/baozi-format-obj" }
baozi-format-ply = { path = "../crates/baozi-format-ply" }
baozi-format-stl = { path = "../crates/baozi-format-stl" }
baozi-import = { path = "../crates/baozi-import" }
baozi-io = { path = "../crates/baozi-io" }
libfuzzer-sys = "0.4"

[[bin]]
name = "stl_import"
path = "fuzz_targets/stl_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "obj_import"
path = "fuzz_targets/obj_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gltf_import"
path = "fuzz_targets/gltf_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ply_import"
path = "fuzz_targets/ply_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_detection"
path = "fuzz_targets/registry_detection.rs"
test = false
doc = false
bench = false

[workspace]
