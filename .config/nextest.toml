[profile.default]
failure-output = "immediate-final"
status-level = "pass"
# Cancellation-prefix fixtures calibrate a complete import, then repeat imports
# to locate exact checkpoints. Keep frequent warnings with bounded CI headroom.
slow-timeout = { period = "5s", terminate-after = 6 }

# Retain the bare std panic probe beside the full owner's zero-allocation result.
[[profile.default.overrides]]
filter = "package(baozi-postprocess) & test(=space::tests::ordinary_host_unwind_drops_converted_scene_and_detached_report)"
success-output = "final"

[[profile.default.overrides]]
filter = "package(baozi-xtask)"
slow-timeout = { period = "10s", terminate-after = 2 }

# Explicitly ignored, complete-pipeline storage pilots include 8 MiB payload scans in debug.
[[profile.default.overrides]]
filter = "test(storage_scale)"
slow-timeout = { period = "60s", terminate-after = 3 }
