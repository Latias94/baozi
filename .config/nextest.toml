[profile.default]
failure-output = "immediate-final"
status-level = "pass"
slow-timeout = { period = "5s", terminate-after = 2 }

# This 4,097-item fixture calibrates a complete import, then repeatedly imports
# while locating exact cancellation prefixes. Allow bounded headroom on CI hosts.
[[profile.default.overrides]]
filter = "package(baozi-format-gltf) & binary(node_graph) & test(=large_node_and_scene_root_cancellation_preserves_exact_completed_prefixes)"
slow-timeout = { period = "15s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(baozi-xtask)"
slow-timeout = { period = "10s", terminate-after = 2 }

# Explicitly ignored, complete-pipeline storage pilots include 8 MiB payload scans in debug.
[[profile.default.overrides]]
filter = "test(storage_scale)"
slow-timeout = { period = "60s", terminate-after = 3 }
