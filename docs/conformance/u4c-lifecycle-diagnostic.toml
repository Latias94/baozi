# This schema freezes only the existing V2 lifecycle diagnostic. It is not U4 exit evidence.
# Each source-anchor SHA-256 uses UTF-8 text after CRLF is normalized to LF.
schema_version = 2
evidence_scope = "lifecycle-diagnostic"

[probe]
id = "canonical-store-u4c-metrics-v2"
test_target = "canonical_scene::store::tests::canonical_store_u4c_metrics_v2_probe"
report_prefix = "BAOZI_U4C_METRICS_V2="

[toolchain]
rustc_release = "1.97.1"
host = "x86_64-pc-windows-msvc"

[fixture]
id = "canonical-store-complex-v1"
source = "crates/baozi-core/src/canonical_scene/store/tests.rs"
schema_revision = 1

[accounting]
baseline = "fresh-factory-and-account"
release_boundary = "terminal-parts-drop"

[coverage]
qualifies_u4_exit = false
observed = ["ledger", "physical-account", "handoff", "release"]
unobserved = [
    "semantic-digest",
    "semantic-mutation-vectors",
    "copy-events",
    "decode-events",
    "lookup-events",
    "producer-events",
    "complete-measurement-closure",
    "handle-relative-input-closure",
    "target-identity",
    "profile-identity",
    "libstd-identity",
    "allocator-identity",
]

