schema_version = 1

# Optional `evidence_claims` describe self-attested subject/revision bindings only. They do not
# establish execution and cannot authorize conformance promotion.

[[gates]]
gate_id = "u4c-lifecycle-v2"
tracer_class = "implementation"
executor = "command"
success_condition = "process-exit-zero"
evidence_identity = "baozi.u4c.lifecycle-diagnostic/v2"
evidence_paths = ["docs/conformance/u4c-lifecycle-diagnostic.toml"]
applicable_contracts = [
  "u4-canonical-scene-lifecycle",
  "u4-retained-physical-ownership",
]
program = "cargo"
args = [
  "+1.97.1",
  "run",
  "-j",
  "1",
  "--locked",
  "-p",
  "baozi-xtask",
  "--",
  "u4c-metrics",
  "--spec",
  "docs/conformance/u4c-lifecycle-diagnostic.toml",
]

[[gates]]
gate_id = "u4c-lifecycle-ci"
tracer_class = "ci"
executor = "workflow"
success_condition = "required-workflow-status"
evidence_identity = "github-actions/ci/u4c-lifecycle-diagnostic/verify-u4c-lifecycle-diagnostic"
evidence_paths = [".github/workflows/ci.yml"]
applicable_contracts = [
  "u4-canonical-scene-lifecycle",
  "u4-retained-physical-ownership",
]
workflow_path = ".github/workflows/ci.yml"
job_id = "u4c-lifecycle-diagnostic"
step_name = "Verify U4c lifecycle diagnostic"

[[gates]]
gate_id = "u4c-production-v2"
tracer_class = "test"
executor = "command"
success_condition = "process-exit-zero"
evidence_identity = "baozi.u4c.production-report/v2-revision-3"
evidence_paths = ["docs/conformance/u4c-metrics.toml"]
applicable_contracts = [
  "u4-canonical-scene-lifecycle",
  "u4-private-producer-consumer-proof",
  "u4-retained-physical-ownership",
  "u4-legacy-scene-deletion",
  "validation-snapshot-fuzz-evidence",
  "source-identity-provenance-metadata",
]
program = "cargo"
args = [
  "+1.95.0",
  "run",
  "-j",
  "1",
  "--locked",
  "-p",
  "baozi-xtask",
  "--features",
  "repository-input-candidate",
  "--target",
  "x86_64-unknown-linux-gnu",
  "--",
  "u4c-metrics",
  "--spec",
  "docs/conformance/u4c-metrics.toml",
]

[[gates]]
gate_id = "u4c-production-ci"
tracer_class = "ci"
executor = "workflow"
success_condition = "required-workflow-status"
evidence_identity = "github-actions/ci/rust/verify-u4c-production-evidence"
evidence_paths = [".github/workflows/ci.yml"]
applicable_contracts = [
  "u4-canonical-scene-lifecycle",
  "u4-private-producer-consumer-proof",
  "u4-retained-physical-ownership",
  "u4-legacy-scene-deletion",
  "validation-snapshot-fuzz-evidence",
  "source-identity-provenance-metadata",
]
workflow_path = ".github/workflows/ci.yml"
job_id = "rust"
step_name = "Verify U4c production evidence"

[[gates]]
gate_id = "repository-conformance-tests"
tracer_class = "test"
executor = "command"
success_condition = "process-exit-zero"
evidence_identity = "baozi.repository-conformance-tests/v2"
evidence_paths = [
  "crates/baozi-xtask/src/conformance.rs",
  "crates/baozi-xtask/src/conformance/evidence.rs",
  "crates/baozi-xtask/src/main.rs",
  "crates/baozi-xtask/tests/conformance.rs",
  "crates/baozi-xtask/tests/conformance_evidence.rs",
  "docs/conformance/contracts.toml",
  "docs/conformance/gates.toml",
  "docs/contributing/adr-governance.md",
]
applicable_contracts = ["repository-architecture-conformance"]
program = "cargo"
args = [
  "nextest",
  "run",
  "--locked",
  "-p",
  "baozi-xtask",
  "--test",
  "conformance",
  "--test",
  "conformance_evidence",
]

[[gates]]
gate_id = "repository-conformance-ci"
tracer_class = "ci"
executor = "workflow"
success_condition = "required-workflow-status"
evidence_identity = "github-actions/ci/rust/check-focused-conformance-inventory"
evidence_paths = [".github/workflows/ci.yml"]
applicable_contracts = ["repository-architecture-conformance"]
workflow_path = ".github/workflows/ci.yml"
job_id = "rust"
step_name = "Check focused conformance inventory"

[[gates]]
gate_id = "postprocess-current-behavior-tests"
tracer_class = "test"
executor = "command"
success_condition = "process-exit-zero"
evidence_identity = "baozi.postprocess.current-behavior-tests/v1"
evidence_paths = [
  "crates/baozi-postprocess/src/pipeline.rs",
  "crates/baozi-postprocess/tests/pipeline.rs",
  "crates/baozi-postprocess/tests/operation_boundary.rs",
]
applicable_contracts = ["postprocess-pipeline-semantics"]
program = "cargo"
args = ["nextest", "run", "--locked", "-p", "baozi-postprocess"]

[[gates]]
gate_id = "obj-resource-current-behavior-tests"
tracer_class = "test"
executor = "command"
success_condition = "process-exit-zero"
evidence_identity = "baozi.obj.resource-current-behavior-tests/v1"
evidence_paths = [
  "crates/baozi-format-obj/src/mtl.rs",
  "crates/baozi/tests/obj_facade.rs",
]
applicable_contracts = ["resource-dependency-graph-manifest"]
program = "cargo"
args = ["nextest", "run", "--locked", "-p", "baozi", "--test", "obj_facade"]

[[gates]]
gate_id = "workspace-tests-ci"
tracer_class = "ci"
executor = "workflow"
success_condition = "required-workflow-status"
evidence_identity = "github-actions/ci/rust/test-workspace"
evidence_paths = [".github/workflows/ci.yml"]
applicable_contracts = [
  "postprocess-pipeline-semantics",
  "resource-dependency-graph-manifest",
]
workflow_path = ".github/workflows/ci.yml"
job_id = "rust"
step_name = "Test workspace"
