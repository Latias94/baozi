# Maintained package manifest. See PATCHES.md for upstream provenance and changes.

[package]
edition = "2021"
name = "baozi-cap-std"
version = "0.1.0"
publish = false
exclude = ["Cargo.toml.orig", ".cargo_vcs_info.json"]
authors = [
    "Dan Gohman <dev@sunfishcode.online>",
    "Jakub Konka <kubkon@jakubkonka.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Baozi-maintained capability standard library bound to its reviewed primitives"
readme = "README.md"
keywords = [
    "std",
    "api",
    "network",
    "file",
]
categories = [
    "filesystem",
    "network-programming",
]
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
repository = "https://github.com/Latias94/baozi"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
arf_strings = [
    "fs_utf8",
    "arf-strings",
]
default = []
fs_utf8 = ["camino"]

[lib]
name = "cap_std"
path = "src/lib.rs"

[dependencies.arf-strings]
version = "0.7.0"
optional = true

[dependencies.camino]
version = "1.0.5"
optional = true

[dependencies.cap-primitives]
package = "baozi-cap-primitives"
path = "../cap-primitives"
version = "=0.1.0"
default-features = false

[dependencies.io-extras]
version = "0.19.0"

[dependencies.io-lifetimes]
version = "3.0.1"
default-features = false

[target."cfg(not(windows))".dependencies.rustix]
version = "1.0.0"
features = ["fs"]
