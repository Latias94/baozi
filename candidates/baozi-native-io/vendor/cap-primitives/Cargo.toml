# Maintained package manifest. See PATCHES.md for upstream provenance and changes.

[package]
edition = "2021"
name = "baozi-cap-primitives"
version = "0.1.0"
publish = false
exclude = ["Cargo.toml.orig", ".cargo_vcs_info.json"]
authors = [
    "Dan Gohman <dev@sunfishcode.online>",
    "Jakub Konka <kubkon@jakubkonka.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Baozi-maintained capability primitives with bounded manual link resolution"
readme = "README.md"
keywords = [
    "api",
    "network",
    "file",
]
categories = [
    "filesystem",
    "network-programming",
]
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
repository = "https://github.com/Latias94/baozi"

[lib]
name = "cap_primitives"
path = "src/lib.rs"

[dependencies.ambient-authority]
version = "0.0.2"

[dependencies.arbitrary]
version = "1.0.0"
features = ["derive"]
optional = true

[dependencies.fs-set-times]
version = "0.20.0"

[dependencies.io-extras]
version = "0.19.0"

[dependencies.io-lifetimes]
version = "3.0.1"
default-features = false

[dependencies.ipnet]
version = "2.5.0"

[dependencies.maybe-owned]
version = "0.3.4"

[dev-dependencies]

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies.rustix-linux-procfs]
version = "0.1.1"

[target."cfg(not(windows))".dependencies.rustix]
version = "1.0.0"
features = [
    "fs",
    "process",
    "termios",
    "time",
]

[target."cfg(windows)".dependencies.windows-sys]
version = "=0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Wdk_Storage_FileSystem",
    "Wdk_Foundation",
]

[target."cfg(windows)".dependencies.winx]
version = "0.36.0"
