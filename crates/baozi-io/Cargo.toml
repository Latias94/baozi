[package]
name = "baozi-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description.workspace = true

[features]
default = []
fs-candidate = ["dep:cap-std", "dep:rustix"]
repository-fs-candidate = ["fs-candidate", "dep:cap-fs-ext"]

[dependencies]
thiserror.workspace = true

[target.'cfg(any(all(target_arch = "x86_64", target_vendor = "unknown", target_os = "linux", target_env = "gnu", target_abi = ""), all(target_arch = "x86_64", target_vendor = "pc", target_os = "windows", target_env = "msvc", target_abi = ""), all(target_arch = "aarch64", target_vendor = "apple", target_os = "macos", target_env = "", target_abi = ""), all(target_arch = "x86_64", target_vendor = "unknown", target_os = "freebsd", target_env = "", target_abi = "")))'.dependencies]
cap-std = { workspace = true, optional = true }
cap-fs-ext = { workspace = true, optional = true, features = ["std"] }

[target.'cfg(any(all(target_arch = "x86_64", target_vendor = "unknown", target_os = "linux", target_env = "gnu", target_abi = ""), all(target_arch = "aarch64", target_vendor = "apple", target_os = "macos", target_env = "", target_abi = ""), all(target_arch = "x86_64", target_vendor = "unknown", target_os = "freebsd", target_env = "", target_abi = "")))'.dependencies]
rustix = { workspace = true, optional = true, features = ["std", "fs"] }
