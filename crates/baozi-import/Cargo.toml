[package]
name = "baozi-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/baozi-import"
authors.workspace = true
description = "Experimental importer registration, detection, sessions, and scene authoring for Baozi"
readme = "README.md"

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
baozi-core = { workspace = true, features = ["_scene-integration"] }
baozi-io.workspace = true
baozi-operation.workspace = true
sha2.workspace = true
tracing = { workspace = true, optional = true }
