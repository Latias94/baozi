[package]
name = "baozi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description.workspace = true

[features]
default = ["std", "default-formats"]
std = []
native-fs-candidate = ["std", "baozi-io/fs-candidate"]
default-formats = ["format-stl", "format-obj"]
all-formats = ["format-stl", "format-obj", "format-ply"]
format-stl = ["dep:baozi-format-stl"]
format-obj = ["dep:baozi-format-obj"]
format-ply = ["dep:baozi-format-ply"]
tracing = ["dep:tracing", "baozi-import/tracing"]
mint = ["baozi-core/mint"]

[dependencies]
baozi-core.workspace = true
baozi-import.workspace = true
baozi-io.workspace = true
baozi-operation.workspace = true
thiserror.workspace = true
baozi-format-stl = { workspace = true, optional = true }
baozi-format-obj = { workspace = true, optional = true }
baozi-format-ply = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
baozi-test-support.workspace = true
criterion.workspace = true

[[bench]]
name = "import_baseline"
harness = false

[[bench]]
name = "import_scale_probe"
harness = false
