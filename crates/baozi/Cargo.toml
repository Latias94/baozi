[package]
name = "baozi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description.workspace = true

[features]
default = ["default-formats"]
native-fs-candidate = ["baozi-io/fs-candidate"]
default-formats = ["format-stl", "format-obj"]
all-formats = ["format-stl", "format-obj", "format-ply", "format-gltf"]
format-stl = ["dep:baozi-format-stl"]
format-obj = ["dep:baozi-format-obj"]
format-ply = ["dep:baozi-format-ply"]
format-gltf = ["dep:baozi-format-gltf"]
postprocess = ["dep:baozi-postprocess"]
tracing = ["baozi-import/tracing", "baozi-postprocess?/tracing"]
mint = ["baozi-core/mint"]

[dependencies]
baozi-core.workspace = true
baozi-import.workspace = true
baozi-io.workspace = true
baozi-operation.workspace = true
baozi-postprocess = { workspace = true, optional = true }
thiserror.workspace = true
baozi-format-stl = { workspace = true, optional = true }
baozi-format-obj = { workspace = true, optional = true }
baozi-format-ply = { workspace = true, optional = true }
baozi-format-gltf = { workspace = true, optional = true }

[dev-dependencies]
baozi-test-support.workspace = true
criterion.workspace = true
tracing.workspace = true

[[example]]
name = "import_bytes"
required-features = ["format-obj"]

[[example]]
name = "import_memory_sidecars"
required-features = ["format-obj"]

[[example]]
name = "diagnostics"
required-features = ["format-obj"]

[[example]]
name = "wasm_memory"
required-features = ["format-obj"]

[[bench]]
name = "import_baseline"
harness = false
required-features = ["format-obj"]

[[bench]]
name = "import_scale_probe"
harness = false
required-features = ["format-obj"]
