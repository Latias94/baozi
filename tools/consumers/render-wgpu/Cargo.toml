[package]
name = "baozi-render-wgpu"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Bounded native headless renderer for Baozi application assets"

[workspace]
resolver = "3"

[dependencies]
baozi = { path = "../../../crates/baozi", version = "=0.1.0", default-features = false, features = ["all-formats", "postprocess"] }
baozi-asset-consumer = { path = "../assets" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"] }
# Pin the audited bundled libjpeg-turbo implementation used by the safe wrapper.
turbojpeg-sys = { version = "=1.1.1", default-features = false }
pollster = "0.4"
half = "2"
serde_json = "1"

[dev-dependencies]
image = { version = "=0.25.8", default-features = false, features = ["jpeg"] }
