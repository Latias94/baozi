name: Scheduled Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Optional earlier Scheduled Fuzz run ID whose retained corpora should be resumed"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  RUST_FUZZ_NIGHTLY: nightly-2026-10-28
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: ${{ matrix.target }} scheduled fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - stl_import
          - obj_import
          - ply_import
          - gltf_import
          - registry_detection
          - edit_lifecycle
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned nightly Rust
        # Dated nightly toolchains use the action's explicit toolchain input path.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_FUZZ_NIGHTLY }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Restore requested campaign corpus
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "${FUZZ_TARGET}-fuzz-*" --dir "$RUNNER_TEMP/fuzz-resume"
          python3 - <<'PY'
          import os
          import hashlib
          from pathlib import Path

          target = os.environ["FUZZ_TARGET"]
          restored = Path(os.environ["RUNNER_TEMP"]) / "fuzz-resume"
          seeds = [path for path in restored.glob(f"**/corpus/{target}/*") if path.is_file()]
          if not seeds:
              raise SystemExit(f"No retained corpus found for {target}")
          corpus = Path("fuzz/corpus") / target
          corpus.mkdir(parents=True, exist_ok=True)
          for seed in seeds:
              data = seed.read_bytes()
              # Merge by content without overwriting the current handwritten regression seeds.
              destination = corpus / hashlib.sha256(data).hexdigest()
              try:
                  with destination.open("xb") as output:
                      output.write(data)
              except FileExistsError:
                  pass
          print(f"Restored {len(seeds)} corpus entries for {target}")
          PY

      - name: Check fuzz target
        run: |
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
          cargo fuzz check "${{ matrix.target }}"

      - name: Check edit lifecycle seed regressions
        if: matrix.target == 'edit_lifecycle'
        run: cargo test --locked --manifest-path fuzz/Cargo.toml --lib --jobs 1

      - name: Record campaign identity
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          mkdir -p "fuzz/artifacts/$FUZZ_TARGET"
          {
            git rev-parse HEAD
            git status --short
            rustc -Vv
            cargo fuzz --version
            printf 'target=%s\nresume_run_id=%s\n' "$FUZZ_TARGET" "$RESUME_RUN_ID"
          } > "fuzz/artifacts/$FUZZ_TARGET/environment.log"

      - name: Run edit lifecycle sanitizer smoke
        if: matrix.target == 'edit_lifecycle'
        run: |
          set -o pipefail
          cargo fuzz run --sanitizer address edit_lifecycle -- -runs=256 -max_len=8196 2>&1 | tee fuzz/artifacts/edit_lifecycle/smoke.log

      - name: Run scheduled fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/artifacts/$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET"
          fuzzer_args=(-max_total_time=120)
          if [[ "$FUZZ_TARGET" == edit_lifecycle ]]; then
            fuzzer_args+=(-max_len=8196)
          fi
          printf 'cargo fuzz run --sanitizer address %s -- %s\n' "$FUZZ_TARGET" "${fuzzer_args[*]}" >> "fuzz/artifacts/$FUZZ_TARGET/environment.log"
          set -o pipefail
          cargo fuzz run --sanitizer address "$FUZZ_TARGET" -- "${fuzzer_args[@]}" 2>&1 | tee "fuzz/artifacts/$FUZZ_TARGET/fuzz.log"
          git diff --exit-code -- fuzz/Cargo.lock

      - name: Retain fuzz corpus and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-fuzz-${{ github.sha }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/**
            fuzz/corpus/${{ matrix.target }}/**
          if-no-files-found: ignore
          retention-days: 30
