name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_FUZZ_NIGHTLY: nightly-2026-05-27
  CARGO_FUZZ_VERSION: 0.13.2
  ACTIONLINT_VERSION: v1.7.12
  GO_VERSION: 1.26.x

jobs:
  actionlint:
    name: Workflow and runner contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse scale runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath './scripts/run-scale-profile.ps1').Path,
            [ref] $parseTokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw ($parseErrors.Message -join "`n")
          }

      - name: Validate scale runner contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $validationRoot = "target/scale-runner-validation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/run-scale-profile.ps1 -ValidateOnly -ArtifactRoot $validationRoot
          $validationPath = Join-Path $validationRoot 'validation.json'
          $validationReport = Get-Content -Raw -LiteralPath $validationPath | ConvertFrom-Json
          if ($validationReport.schema -ne 'baozi-scale-report/v1' -or
              $validationReport.execution_mode -ne 'validate_only' -or
              $validationReport.status -ne 'passed') {
            throw 'scale runner validation did not produce a passing validation report'
          }

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Check workflow syntax
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, wasm32-wasip1, x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-unknown-linux-gnux32

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo nextest run --locked --workspace --exclude baozi-xtask

      - name: Test all workspace features
        run: cargo nextest run --locked --workspace --all-features --exclude baozi-xtask

      - name: Test documentation examples
        run: cargo test --locked --doc --workspace --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Check no-default facade
        run: cargo check --locked -p baozi --no-default-features

      - name: Check exact Linux native filesystem candidate facade
        run: cargo check --locked -p baozi --target x86_64-unknown-linux-gnu --no-default-features --features all-formats,native-fs-candidate

      - name: Check browser WASM bytes path
        run: cargo check --locked -p baozi --target wasm32-unknown-unknown --no-default-features --features all-formats

      - name: Check WASI bytes and custom-IO path
        run: cargo check --locked -p baozi --target wasm32-wasip1 --no-default-features --features all-formats

      - name: Prove non-candidate native filesystem targets fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedDiagnostic = 'baozi-io/fs-candidate is available only on exact runtime candidate targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-apple-darwin; use memory or custom IO'
          $negativeTargets = @(
            'wasm32-unknown-unknown'
            'wasm32-wasip1'
            'x86_64-apple-darwin'
            'x86_64-unknown-freebsd'
            'x86_64-unknown-linux-gnux32'
          )
          $installedTargets = @(rustup target list --installed)
          if ($LASTEXITCODE -ne 0) {
            throw 'failed to list installed Rust targets'
          }
          foreach ($targetTriple in $negativeTargets) {
            if ($installedTargets -notcontains $targetTriple) {
              throw "negative target is not installed: $targetTriple"
            }
            $cargoOutput = cargo check --locked --color never -p baozi --target $targetTriple --no-default-features --features all-formats,native-fs-candidate 2>&1 | Out-String
            $cargoStatus = $LASTEXITCODE
            if ($cargoStatus -eq 0) {
              throw "native-fs-candidate unexpectedly compiled for $targetTriple"
            }
            if ($cargoOutput.Contains("can't find crate for")) {
              Write-Host $cargoOutput
              throw "native-fs-candidate failed because target $targetTriple was not installed"
            }
            if (-not $cargoOutput.Contains($expectedDiagnostic)) {
              Write-Host $cargoOutput
              throw "native-fs-candidate failed for $targetTriple without the fail-closed diagnostic"
            }
          }

      - name: Check crate dependency architecture
        run: cargo run --locked -p baozi-xtask -- crate-graph-check

      - name: Check runtime neutrality and host admission
        run: cargo run --locked -p baozi-xtask -- runtime-admission-check

      - name: Check native filesystem dependency admission
        run: cargo run --locked -p baozi-xtask -- native-fs-check

      - name: Check dependency policy
        run: cargo deny --locked check

      - name: Check fuzz dependency policy
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml check

      - name: Package release leaf crates
        run: |
          cargo package --locked -p baozi-operation
          cargo package --locked -p baozi-io

  native-fs-candidate:
    name: Native filesystem candidate (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Verify exact runner host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rustcHostLines = @(rustc -vV | Where-Object { $_ -like 'host: *' })
          if ($LASTEXITCODE -ne 0 -or $rustcHostLines.Count -ne 1) {
            throw 'rustc -vV did not report exactly one host triple'
          }
          $rustcHostTriple = $rustcHostLines[0].Substring('host: '.Length)
          if ($rustcHostTriple -ne '${{ matrix.target }}') {
            throw "runner host $rustcHostTriple does not match matrix target ${{ matrix.target }}"
          }

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check native filesystem dependency admission
        run: cargo run --locked -p baozi-xtask --target "${{ matrix.target }}" -- native-fs-check

      - name: Check native filesystem candidate facade wiring
        run: cargo check --locked -p baozi --target "${{ matrix.target }}" --no-default-features --features all-formats,native-fs-candidate

      - name: Test native filesystem candidate facade
        run: cargo nextest run --locked --target "${{ matrix.target }}" -p baozi --no-default-features --features all-formats,native-fs-candidate

      - name: Test capability-bound native filesystem candidate without skipped fixtures
        run: cargo nextest run --locked --target "${{ matrix.target }}" -p baozi-io --features fs-candidate

  fuzz:
    name: ${{ matrix.target }} sanitizer fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - stl_import
          - obj_import
          - obj_postprocess
          - ply_import
          - registry_detection
          - scene_validation
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned nightly Rust
        # Dated nightly toolchains use the action's explicit toolchain input path.
        # See docs/contributing/fuzzing.md for why Linux CI is the sanitizer authority.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_FUZZ_NIGHTLY }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Check fuzz target
        run: cargo fuzz check "${{ matrix.target }}"

      - name: Run fuzz smoke
        run: cargo fuzz run "${{ matrix.target }}" -- -runs=256

  non-admitted-fuzz-check:
    name: ${{ matrix.target }} non-admitted candidate fuzz check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - gltf_import
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned nightly Rust
        # Dated nightly toolchains use the action's explicit toolchain input path.
        # glTF is not facade-admitted until the bootstrap backend no longer aborts under fuzz.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_FUZZ_NIGHTLY }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Check fuzz target
        run: cargo fuzz check "${{ matrix.target }}"
